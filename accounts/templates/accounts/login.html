<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #14a49a;
            --primary-hover: #118c83;
            --text-muted: #6c757d;
        }

        body {
            background-color: #f4f7f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            padding: 40px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline-secondary {
            border-color: #dee2e6;
            color: #333;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px;
        }

        .btn-outline-secondary:hover {
            background-color: #f8f9fa;
            border-color: #ced4da;
            color: #333;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 25px 0;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .forgot-link, .lock-screen-link, .create-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .forgot-link:hover, .lock-screen-link:hover, .create-link:hover {
            color: var(--primary-hover);
        }

        .input-group-text {
            background: transparent;
            cursor: pointer;
            border-left: none;
        }
        
        .password-input {
            border-right: none;
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="fw-bold mb-1">Welcome back</h2>
    <p class="text-muted mb-4">Sign in to continue to your FlexAdmin workspace.</p>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input class="form-control" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <div class="d-flex justify-content-between">
                <label for="password" class="form-label">Password</label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-group">
                <input type="password" class="form-control password-input" id="password" name="password" placeholder="Enter your password" required>
                <span class="input-group-text">
                    <i class="bi bi-eye text-muted"></i>
                </span>
            </div>
        </div>

        <!-- Remember me & Lock screen -->
        <!--
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label text-muted small" style="font-weight: 500;" for="remember">
                    Remember me
                </label>
            </div>
            <a href="#" class="lock-screen-link">Use lock screen</a>
        </div>
        -->
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
        <!--
        <div class="divider">or continue with</div>
        -->
        <!-- Social Login -->
        <!--
        <div class="row g-2 mb-4">
            <div class="col-6">
                <button type="button" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-google me-2"></i> Google
                </button>
            </div>
            <div class="col-6">
                <button type="button" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-github me-2"></i> GitHub
                </button>
            </div>
        </div>
        -->
        <!-- Footer -->
        <!--
        <div class="text-center">
            <p class="text-muted small mb-0">Don't have an account? <a href="#" class="create-link">Create one</a></p>
        </div>
        -->
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Простой скрипт для переключения видимости пароля
    document.querySelector('.input-group-text').addEventListener('click', function() {
        const passwordInput = document.querySelector('#password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });
</script>

</body>
</html>

{% extends 'base.html' %}

{% block title %}Неверный запрос - 400{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <!-- Шапка с логотипом и бейджем -->
        <div class="d-flex justify-content-center align-items-center gap-2 mb-4">
            <img src="logo.png" alt="Logo" height="30">
            <span class="error-badge" style="background:#f0fdfa; color:#14a49a;">Error 400</span>
        </div>

        <!-- Иконка ошибки 400 -->
        <div class="error-icon-circle" style="background-color: #e0f2fe; color: #0ea5e9;">
            <i class="bi bi-patch-exclamation"></i>
        </div>
        
        <h2 class="error-heading">Bad request</h2>
        <p class="error-desc">
            Your browser sent a request that this server could not understand. 
            Please check for syntax errors or try clearing your browser cache.
        </p>
        
        <div class="d-flex justify-content-center gap-3">
            <button onclick="location.reload()" class="btn-error-main">
                <i class="bi bi-arrow-clockwise"></i> Refresh Page
            </button>
            <a href="/" class="btn-error-outline">
                <i class="bi bi-house"></i> Home Screen
            </a>
        </div>
    </div>
</div>
{% endblock %}

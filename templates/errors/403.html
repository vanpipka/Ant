{% extends 'base.html' %}

{% block title %}Доступ запрещен - 403{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="d-flex justify-content-center align-items-center gap-2 mb-4">
            <img src="logo.png" alt="Logo" height="30">
            <span class="error-badge" style="background:#f0fdfa; color:#14a49a;">Error 403</span>
        </div>

        <div class="error-icon-circle bg-orange-light">
            <i class="bi bi-shield-lock"></i>
        </div>
        
        <h2 class="error-heading">Access restricted</h2>
        <p class="error-desc">Your account does not have permission to view this resource. Sign in with a different role or contact your administrator.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="/login/" class="btn-error-main">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </a>
            <a href="/workspace/" class="btn-error-outline">
                <i class="bi bi-grid"></i> Workspace
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% load static %}
<header class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" height="64">
            <!--<span class="fw-bold fs-4 text-dark" style="letter-spacing: -0.5px;">FlexAdmin</span>-->
        </a>

        <!-- Right Side: User Profile -->
        <div class="ms-auto d-flex align-items-center">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    
                    <a class="icon-link nav-link" href="/products">
                        <i class="bi bi-cart4"></i>
                        Каталог</a>
                </li>
            </ul>

            <!-- Vertical Divider -->
            <div class="vr mx-3 text-muted opacity-25" style="height: 40px;"></div>
            
            <div class="dropdown">

                {% if user.is_authenticated %}

                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle hide-caret" 
                    id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        
                        <!-- Avatar -->
                        <div class="position-relative me-2">
                            <img src="https://ui-avatars.com/api/?name={{user.username}}&background=14a49a&color=fff" 
                                alt="Avatar" width="40" height="40" class="rounded-circle border border-2 border-primary-subtle">
                        </div>

                        <!-- User Info -->
                        <div class="d-none d-sm-block me-2">
                            <div class="fw-bold text-dark lh-1 mb-1" style="font-size: 0.95rem;">{{ user.get_full_name|default:user.username }}</div>
                        </div>
                        
                        <i class="bi bi-chevron-down text-muted small"></i>
                    </a>
                    
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item py-2" href="#"><i class="bi bi-gear me-2"></i> Настройки </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right me-2"></i> Выйти</a></li>
                    </ul>
                    
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                {% endif %}

                
            </div>
        </div>
    </div>
</header>
